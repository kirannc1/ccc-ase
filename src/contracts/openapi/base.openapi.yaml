openapi: 3.1.0
info:
  title: CCC ASE Foundation API
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      responses:
        "200":
          description: OK
  /api/v1/recommendations:
    post:
      summary: Create recommendation cycle
      responses:
        "200":
          description: OK
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
    SchemaVersion:
      type: object
      properties:
        schema_version:
          type: string

